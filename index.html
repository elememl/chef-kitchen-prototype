<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Chef Kitchen — Interactive Prototype</title>
<style>
:root{
  --green:#2B6643; --deep:#274535; --ink:#29382C; --muted:#788175;
  --pale:#ECF3E8; --pale2:#F4F7F0; --line:#D7E1D1;
  --page:#F7F9F7; --white:#FFFFFF; --danger:#A34B37;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#F0F2EA;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.52}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #BD7A37;outline-offset:2px}
svg{flex:none}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.topbar strong{font-size:15px;color:var(--deep)}
.topbar button{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
.main{max-width:780px;min-height:calc(100dvh - 58px);margin:0 auto;padding:22px;display:grid;grid-template-columns:265px 420px;align-items:start;justify-content:center;gap:23px}
.aside{padding:19px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px #10362909}
.aside h2{font-size:16px;margin:0 0 14px}
.aside p{font-size:13px;line-height:1.5;color:var(--muted);margin:8px 0}
.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--green);font-weight:700;margin-bottom:7px}
.test-task{padding:14px 0;border-top:1px solid var(--line)}
.test-task:first-of-type{border-top:0;padding-top:0}
.test-task b{font-size:13px;line-height:1.4;display:block}
.tiny{font-size:11px!important;color:var(--muted)}
.side-status{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.side-status span{display:block;margin-top:6px;font-size:12px;color:var(--green);font-weight:700}
.testing-note{font-size:12px;color:var(--muted);line-height:1.5}

.btn{border:1px solid var(--line);background:#fff;border-radius:11px;color:var(--deep);font-size:14px;line-height:1.2;padding:12px 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center;font-weight:700;min-height:43px}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.soft{background:var(--pale);color:var(--green);border-color:var(--pale)}
.btn.danger{color:var(--danger);border-color:#EAD9D4}
.btn.small{min-height:34px;padding:8px 12px;font-size:12px;border-radius:9px}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn + .btn{margin-left:0}
.phone-wrap{display:flex;justify-content:center}
.phone{height:min(840px,calc(100dvh - 104px));min-height:650px;width:420px;border-radius:32px;border:6px solid #314536;background:var(--page);box-shadow:0 25px 55px #1D322C29;display:flex;flex-direction:column;overflow:hidden}
.phone-header{flex:none;background:var(--deep);color:#fff;padding:12px 22px 20px;border-radius:0 0 21px 21px}
.phone-header.simple{background:#fff;color:var(--ink);border-radius:0;border-bottom:1px solid var(--line);padding-bottom:16px}
.statusline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;height:18px;margin-bottom:16px}
.statusline .status-icons{display:flex;align-items:center;gap:5px}
.statusline .dot{height:6px;width:6px;border-radius:10px;background:currentColor}
.statusline .battery{height:8px;width:18px;border:1.6px solid currentColor;border-radius:3px}
.heading-row{display:flex;align-items:center;gap:8px}
.back-inline{border:0;background:transparent;color:inherit;padding:5px 4px 5px 0;display:flex;align-items:center}
.heading-row h1{margin:0;font-size:27px;line-height:1.14;letter-spacing:-.7px;font-weight:700}
.phone-header .subtitle{font-size:12px;color:#D9EAE1;margin:9px 0 0;line-height:1.4}
.phone-header.simple .subtitle{color:var(--muted)}
.viewport{flex:1;min-height:0;overflow:auto;padding:17px 16px 24px;scrollbar-width:thin;scrollbar-color:#C5D3C9 transparent}
.viewport::-webkit-scrollbar{width:5px}.viewport::-webkit-scrollbar-thumb{background:#C5D3C9;border-radius:10px}
.bottom-nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:8px 3px 9px}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:#697665;font-size:9px;min-width:0;padding:4px 0 2px}
.nav-btn svg{height:21px;width:21px}
.nav-btn span{white-space:nowrap;letter-spacing:-.25px}
.nav-btn.active{font-weight:700;color:var(--green)}
.nav-btn.active .nav-icon{background:var(--pale)}
.nav-icon{height:33px;width:42px;display:flex;align-items:center;justify-content:center;border-radius:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}
.card.padless{padding:0;overflow:hidden}
.card.flat{background:var(--pale2)}
.card h3{font-size:16px;margin:0 0 7px}
.card p{font-size:13px;line-height:1.45;color:var(--muted);margin:4px 0}
.section-title{font-size:17px;font-weight:700;margin:20px 1px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title:first-child{margin-top:2px}
.section-title .link{font-size:12px}
.link{color:var(--green);background:transparent;border:0;font-weight:700;padding:4px}
.kicker{font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.column{display:flex;flex-direction:column;gap:8px}
.gap4{gap:4px}.gap12{gap:12px}.grow{flex:1;min-width:0}.right{text-align:right}
.text-small{font-size:12px;color:var(--muted);line-height:1.4}
.text-body{font-size:13px;line-height:1.5;color:var(--ink)}
.text-strong{font-size:14px;font-weight:700}
.text-green{color:var(--green)}
.text-big{font-size:27px;font-weight:700;color:var(--deep)}
.muted{color:var(--muted)}
.line{border-top:1px solid var(--line);margin:12px 0}
.pill{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:8px 12px;font-size:12px;white-space:nowrap}
.pill.selected{background:var(--green);color:#fff;border-color:var(--green)}
.pill.soft{background:var(--pale);color:var(--green);border-color:var(--pale)}
.chips{display:flex;gap:7px;overflow:auto;padding:1px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;height:48px}
.searchbar svg{color:var(--green)}.searchbar input{font-size:13px;width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.iconbox{width:40px;height:40px;border-radius:12px;background:var(--pale);color:var(--green);display:grid;place-items:center}
.listrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border:0;padding-bottom:0}
.row-btn{border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;min-width:0;width:100%;text-align:left;color:inherit}
.row-btn .chev{margin-left:auto;color:#83917D}
.cat-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff;margin-bottom:8px}
.cat-item button{border:0;background:none;color:var(--ink);display:flex;align-items:center;gap:10px;width:100%;padding:0;text-align:left}
.stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
.stat-tile{padding:11px 2px;border-radius:11px;background:var(--pale2);text-align:center}
.stat-tile strong{display:block;font-size:18px;color:var(--deep)}
.stat-tile span{font-size:9px;color:var(--muted);text-transform:uppercase}
.alert-card{border-left:4px solid var(--green)}
.button-row{display:flex;gap:8px;margin-top:13px}
.button-row > *{flex:1;min-width:0}
.option-row{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px 12px;margin-bottom:9px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink)}
.option-row .chev{margin-left:auto;color:#758D80}
.option-row strong{display:block;font-size:14px}
.option-row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.metric-grid .metric{padding:10px 3px;background:var(--pale2);text-align:center;border-radius:11px}
.metric strong{display:block;font-size:14px;color:var(--deep)}
.metric span{font-size:9px;color:var(--muted)}
.feature-art{display:flex;align-items:center;justify-content:center;height:105px;background:var(--pale);border-radius:13px;margin-bottom:11px;color:var(--green)}
.feature-art svg{width:84px;height:84px}
.recipe-tile{display:flex;gap:11px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-bottom:7px}
.recipe-tile .grow strong{font-size:13px;display:block}.recipe-tile small{color:var(--muted);font-size:10px}
.recipe-tile button{padding:6px;border:0;background:transparent;color:var(--green)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.day small{font-size:10px;color:var(--muted)}.day b{font-size:15px}
.day.active{background:var(--green);border-color:var(--green);color:#fff}.day.active small{color:#E3F1E7}
.meal-options{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.meal-options button{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 3px;font-size:11px}
.meal-options button.active{background:var(--green);color:#fff;border-color:var(--green)}
.label-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin-bottom:6px}
.progress{height:7px;background:#E5EDE7;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}
.nutrition-list{display:flex;flex-direction:column;gap:0}
.nutrition-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 2px;font-size:13px}
.nutrition-line:last-child{border:0}
.nutrition-line strong{font-weight:700;color:var(--deep)}
.nutrient-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.nutrient-grid div{background:var(--pale2);padding:10px 12px;border-radius:11px;display:flex;flex-direction:column;gap:3px}
.nutrient-grid span{font-size:12px;font-weight:700}.nutrient-grid small{color:var(--muted);font-size:11px}
.assist-card{background:var(--pale);border:1px solid #D6E6D9;border-radius:14px;padding:12px;width:100%;display:flex;align-items:center;gap:11px;color:var(--deep);text-align:left}
.assist-card strong{font-size:15px;display:block}.assist-card small{display:block;font-size:11px;color:#6D8176;margin-top:4px}
.step-body{min-height:170px;border:1px solid var(--line);border-radius:15px;padding:18px;background:#fff;margin:13px 0}
.step-body h3{font-size:17px;margin:0 0 13px}.step-body p{font-size:14px;line-height:1.65;margin:0}
.input{height:43px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
.textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;resize:vertical;min-height:84px;color:var(--ink)}
.inputlabel{font-size:12px;font-weight:700;color:var(--ink);display:block;margin:10px 0 5px}




.note{background:var(--pale2);border-radius:12px;padding:12px;font-size:12px;line-height:1.45;color:#5D7366}

.ai-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-shortcuts button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;display:flex;align-items:flex-start;gap:9px;text-align:left;min-height:69px;color:var(--deep)}
.ai-shortcuts button strong{font-size:12px;display:block;margin-bottom:3px}.ai-shortcuts button small{font-size:10px;color:var(--muted);display:block;line-height:1.35}
.chatbubble{background:var(--pale);border-radius:16px 16px 4px 16px;padding:14px;font-size:13px;line-height:1.55;margin-bottom:12px}
.assistant-reply{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px;font-size:13px;line-height:1.55;margin-bottom:12px}
.recipe-info{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted)}

.overlay{position:fixed;inset:0;background:#132D25A8;display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
.modal{background:#fff;border-radius:17px;box-shadow:0 12px 45px #10251D4D;padding:19px;width:100%;max-width:450px;max-height:90dvh;overflow:auto}
.modal h2{font-size:19px;line-height:1.25;margin:0 0 8px}.modal .modal-desc{font-size:13px;line-height:1.5;color:var(--muted);margin:6px 0 15px}
.modal .option-row{margin-bottom:7px}
.modal-footer{margin-top:15px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.snackbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183F31;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 26px #10291D55;z-index:55;font-size:13px;max-width:calc(100% - 24px);text-align:center}
@media(max-width:1080px){.main{grid-template-columns:240px 420px;justify-content:center}}
@media(max-width:760px){.topbar{height:48px;padding:0 13px}.main{display:flex;flex-direction:column;align-items:center;padding:8px;gap:12px}.aside{max-width:420px;width:100%}.test-panel{order:2}.phone-wrap{order:1;width:100%}.phone{width:min(100%,420px);height:min(840px,calc(100dvh - 70px));min-height:575px}}
@media print{.topbar,.aside{display:none}.main{display:block;padding:0}.phone{border:0;box-shadow:none;border-radius:0;width:100%;height:auto}.viewport{overflow:visible}.bottom-nav{display:none}}

.prototype-controls{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.prototype-controls h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 9px}
.control-check{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink);cursor:pointer;margin:11px 0;line-height:1.35}
.control-check input{width:16px;height:16px;accent-color:var(--green);flex:none}

@media(max-width:1080px) and (min-width:761px){.main{grid-template-columns:225px 420px;max-width:740px}}

.cooking-tools{margin:10px 0 12px}
.cooking-tools .btn{white-space:normal}

.phone .products-summary .stat-tiles{margin-top:12px;gap:7px}
.phone .products-summary .stat-tile{padding:10px 2px}
.phone .product-filters{margin:4px 0 10px}
.phone .product-expiry{margin-top:0;padding:13px}
.phone .product-expiry h3{margin:5px 0 10px;font-size:16px}
.phone .product-expiry .btn{min-height:34px}
.phone .category-heading{margin-top:11px;margin-bottom:8px}
.phone .cat-item{padding:8px 10px;margin-bottom:7px}
.phone .cat-item .iconbox{width:35px;height:35px;border-radius:10px}
.phone .cat-item .pill{padding:6px 11px}
.phone .recipe-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:7px 0 13px}
.phone .recipe-shortcut{min-width:0;min-height:91px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:5px}
.phone .recipe-shortcut .shortcut-icon{color:var(--green);width:31px;height:31px;background:var(--pale);border-radius:9px;display:grid;place-items:center;flex:none}

.phone .recipe-shortcut:disabled .shortcut-icon{color:var(--green)}

.phone .recipe-section-head .btn{min-height:30px;padding:5px 9px}
.phone .feature-recipe .feature-art{height:107px}

.phone .feature-recipe .btn{white-space:nowrap}
.phone .feature-recipe .row{align-items:center}
.phone .recipe-details-layout .feature-art{height:112px;margin-bottom:10px}
.phone .recipe-details-layout .metric-grid{margin:11px 0 10px}
.phone .recipe-details-layout .metric strong{font-size:13px}
.phone .recipe-details-layout .metric span{font-size:10px}
.phone .recipe-details-layout .detail-main{margin-bottom:9px}
.phone .recipe-details-layout .option-row{padding:11px 12px;min-height:64px}
.phone .recipe-details-layout .option-row strong{font-size:13px}
.phone .recipe-details-layout .option-row small{font-size:10px}
.phone .recipe-details-layout .meal-plan-entry{margin-top:2px}
.phone .month-heading{margin:0 0 11px}
.phone .month-heading strong{font-size:17px;color:var(--ink)}
.phone .days{margin-bottom:13px}

function ltText(input){
 const src=String(input||'').trim();
 if(!src)return src;
 if(Object.prototype.hasOwnProperty.call(LT_COPY,src))return LT_COPY[src];
 let m;
 if(m=src.match(/^(\d+) of (\d+) screens viewed$/))return `Peržiūrėta ${m[1]} iš ${m[2]} ekranų`;
 if(m=src.match(/^(\d+) of (\d+)$/))return `${m[1]} iš ${m[2]}`;
 if(m=src.match(/^Step (\d+) of (\d+)$/i))return `${m[1]} iš ${m[2]} žingsnių`;
 if(m=src.match(/^\€([\d.,]+) spent$/))return `Išleista ${m[1]} €`;
 if(m=src.match(/^\€([\d.,]+) remaining$/))return `Liko ${m[1]} €`;
 if(m=src.match(/^of €([\d.,]+)$/))return `iš ${m[1]} €`;
 if(m=src.match(/^(\d+) min · (\d+) servings · Medium$/))return `${m[1]} min. · ${m[2]} porcijos · vidutinis sudėtingumas`;
 if(m=src.match(/^(\d+) min · (\d+) servings$/))return `${m[1]} min. · ${m[2]} porcijos`;
 if(m=src.match(/^(\d+) servings$/))return `${m[1]} porcijos`;
 if(m=src.match(/^(\d+) min$/))return `${m[1]} min.`;
 if(m=src.match(/^(\d+) products recognised$/))return `Atpažinti ${m[1]} produktai`;
 if(m=src.match(/^(\d+) products$/i))return `${m[1]} produktai`;
 if(m=src.match(/^([\d.,]+) (?:pcs|cartons|packs|tubs|loaves|bunches)$/i))return `${m[1]} vnt.`;
 if(m=src.match(/^Select (.+)$/))return `Pažymėti: ${ltText(m[1])}`;
 if(m=src.match(/^Deselect (.+)$/))return `Atžymėti: ${ltText(m[1])}`;
 if(m=src.match(/^Edit (.+)$/))return `Redaguoti: ${ltText(m[1])}`;
 if(m=src.match(/^Open (.+)$/))return `Atidaryti: ${ltText(m[1])}`;
 if(m=src.match(/^Remove (.+)$/))return `Pašalinti: ${ltText(m[1])}`;
 if(m=src.match(/^Mark (.+) done$/))return `Pažymėti kaip nupirktą: ${ltText(m[1])}`;
 if(m=src.match(/^Timer running:\s*$/))return 'Laikmatis veikia:';
 if(m=src.match(/^Timer preview: (\d+) seconds \(not running\)$/))return `Laikmačio peržiūra: ${m[1]} sek. (nepaleistas)`;
 if(m=src.match(/^Adaptation preference: (.+)$/))return `Pritaikymo pasirinkimas: ${ltText(m[1])}`;
 if(m=src.match(/^([^·]+) · Planned$/))return `${ltText(m[1])} · Suplanuota`;
 if(m=src.match(/^([^·]+) · No meal planned$/))return `${ltText(m[1])} · Patiekalas nesuplanuotas`;
 if(m=src.match(/^(.+) · per serving$/))return `${ltText(m[1])} · vienai porcijai`;
 return src;
}
function translateVisibleCopy(root){
 const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const textNodes=[];
 while(walk.nextNode())textNodes.push(walk.currentNode);
 for(const node of textNodes){
   const raw=node.nodeValue;
   const trimmed=raw.trim();
   if(!trimmed)continue;
   const translated=ltText(trimmed);
   if(translated!==trimmed){
     const at=raw.indexOf(trimmed);
     node.nodeValue=raw.slice(0,at)+translated+raw.slice(at+trimmed.length);
   }
 }
 root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(node=>{
   for(const key of ['placeholder','aria-label','title']){
     if(node.hasAttribute(key)){
       const old=node.getAttribute(key);
       const next=ltText(old);
       if(next!==old)node.setAttribute(key,next);
     }
   }
 });
}

function nav(){const active=activeNav(state.page);return `<nav class="bottom-nav" aria-label="Main navigation">${NAV.map(([page,label,glyph])=>`<button class="nav-btn ${active===page?'active':''}" data-action="nav" data-page="${page}" aria-label="${label}" ${active===page?'aria-current="page"':''}><span class="nav-icon">${icon(page==='recipes'?'pot':glyph,21)}</span><span>${label}</span></button>`).join('')}</nav>`}

  if (isLithuanian) translateVisibleCopy(root);
  if (state.page === 'recipeDetail') requestAnimationFrame(fitRecipeDetail);

function fitRecipeDetail(){
 if(state.page!=='recipeDetail')return;
 const viewport=document.getElementById('viewport');
 const content=viewport?.querySelector('.recipe-detail-screen');
 if(!viewport||!content)return;
 const style=getComputedStyle(viewport);
 const free=viewport.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-3;
 if(free<=0)return;
 function at(scale){content.style.zoom=String(scale);return content.getBoundingClientRect().height;}
 if(at(1)<=free){at(1);return;}
 let lo=.48,hi=1;
 for(let i=0;i<16;i++){
  const mid=(lo+hi)/2;
  if(at(mid)<=free)lo=mid;else hi=mid;
 }
 at(lo);
 viewport.scrollTop=0;
}
window.addEventListener('resize',()=>{if(state.page==='recipeDetail')requestAnimationFrame(fitRecipeDetail)});

function go(page,push=true){if(!HEADINGS[page])return;if(push&&page!==state.page)state.history.push(state.page);state.page=page;state.modal=null;render();}
function back(){if(state.modal){state.modal=null;render();return}const prev=state.history.pop();go(prev||activeNav(state.page),false)}
function openRecipe(id){state.recipe=id in RECIPES?id:'chicken';go('recipeDetail')}
function openModal(name,data={}){state.modal={name,...data};render()}
function modalHtml(m){let title='',content='',foot='';
const close=`<button class="btn" data-action="closeModal">Close</button>`;
switch(m.name){
case 'editReceipt':title='Edit product';{const item=state.receipt.find(x=>x.id===Number(m.id))||state.receipt[0];content=`<label class="inputlabel">Product</label><input class="input" id="editReceiptName" value="${esc(item.name)}"/><label class="inputlabel">Quantity</label><input class="input" id="editReceiptQty" type="number" min="1" value="${item.qty}"/><label class="inputlabel">Price (€)</label><input class="input" id="editReceiptPrice" type="number" step="0.01" min="0" value="${item.price.toFixed(2)}"/>`;foot=`<button class="btn primary" data-action="saveReceiptEdit" data-id="${item.id}">Save changes</button>${close}`;}break;
case 'voiceHelp':title='Voice assistant & control';content=`<p class="modal-desc">Say <strong>“Chef”</strong> to activate voice control. You can:</p><div class="column"><div class="note">Have a conversation or ask cooking questions</div><div class="note">Set a timer or read a step aloud</div><div class="note">Move to the next or previous cooking step</div><div class="note">Activate the camera to ask about an ingredient or cooking step</div></div>`;foot=close;break;
case 'cameraHelp':title='Camera questions';content=`<p class="modal-desc">You could show Chef an ingredient or cooking stage and ask a question.</p><div class="note">Example question: “Are these vegetables chopped small enough?”</div>`;foot=close;break;
case 'timer':title='Set a cooking timer';content=`<label class="inputlabel">Duration in seconds</label><input class="input" type="number" id="timerSeconds" min="1" max="86400" value="30"/>`;foot=`<button class="btn primary" data-action="startTimer">Set timer</button>${close}`;break;
default:title='Options';content='<p class="modal-desc">Choose an action to continue.</p>';foot=close;
}
return `<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row between"><h2 id="modal-title">${title}</h2><button class="link" data-action="closeModal" aria-label="Close">${icon('x',21)}</button></div>${content}<div class="modal-footer">${foot}</div></div></div>`}
function handleClick(el){const act=el.dataset.action;const id=Number(el.dataset.id||0);switch(act){
case 'nav':go(el.dataset.page);break;
case 'go':go(el.dataset.page);break;
case 'back':back();break;
case 'reset':init();render();break;
case 'openRecipe':openRecipe(el.dataset.recipe);break;
case 'openNutrition':state.recipe=el.dataset.recipe||'onions';go('nutrition');break;
case 'savedRecipes':go('allRecipes');break;
case 'modal':openModal(el.dataset.modal,{id});break;
case 'closeModal':state.modal=null;render();break;
case 'toggleReceipt':{const r=state.receipt.find(x=>x.id===id);if(r)r.selected=!r.selected;render();break;}
case 'selectReceipt':state.receipt.forEach(x=>x.selected=true);render();break;
case 'saveReceiptEdit':{const r=state.receipt.find(x=>x.id===id);if(!r)break;r.name=document.getElementById('editReceiptName').value||r.name;r.qty=Math.max(1,Number(document.getElementById('editReceiptQty').value)||1);r.price=Math.max(0,Number(document.getElementById('editReceiptPrice').value)||0);state.modal=null;render();break;}
case 'confirmReceipt':{const total=state.receipt.filter(x=>x.selected).reduce((s,x)=>s+x.price,0);if(total===0)return;if(!state.imported){state.imported=true;state.spent+=total;}go('receiptDone');break;}
case 'productsFilter':if(el.dataset.filter==='all')render();break;
case 'useMilk':go('recipes');break;
case 'searchProducts':break;
case 'startCooking':state.step=0;go('cooking');break;
case 'cancelReceipt':go('scan');break;
case 'clearRecipeSearch':state.recipeQuery='';render();break;
case 'nextCooking':{const r=RECIPES[state.recipe];if(state.step<r.steps.length-1){state.step++;render()}else{go('recipeFeedback')}break;}
case 'prevCooking':if(state.step>0){state.step--;render()}else back();break;
case 'saveFeedback':state.notes=document.getElementById('recipeNotes')?.value||'';go('recipes');break;

case 'startTimer':{const seconds=Math.max(1,Math.min(86400,Number(document.getElementById('timerSeconds')?.value)||30));state.timerPreviewSeconds=seconds;state.modal=null;render();break;}
case 'setDay':state.day=Number(el.dataset.day);render();break;
case 'setMeal':state.meal=el.dataset.meal;render();break;
case 'toggleMonth':state.monthView=!state.monthView;render();break;
case 'addToMeal':state.meal='Lunch';state.day=2;go('plan');break;
default:break;
}}
document.addEventListener('change',event=>{
  const option = event.target?.dataset?.option;
  if (option === 'lithuanian') state.language = 'lt';
  else if (option === 'english') state.language = 'en';
  else return;
  render();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleClick(b)}else if(e.target.classList?.contains('overlay')){state.modal=null;render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const kind=f.dataset.form;if(kind==='recipeSearch'){state.recipeQuery=document.getElementById('recipeSearch')?.value||'';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back()}});
render();
</script>
</body>
</html>
